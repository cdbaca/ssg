{% extends "base.html" %}
{% block content %}
<div class="box photos-box full-page">
    {% for photo in data %}
    <a data-flickr-embed="true" href="{{ photo['img_link'] }}" title="{{ photo['title'] }}">
        <img src="{{ photo['img'] }}" alt="{{ photo['title'] }}">
    </a>
    {% endfor %}
</div>
{% endblock %}
