{% extends "base.html" %}
{% block content %}
<div class="box tag-box">
    <h1>Tags</h1>
    <ul>
        {% for k, v in data.items() %}
        <li>
            <a href="./tags/{{ k }}.html">{{ k }}</a>
            <span class="post-date">{{ v }} post{% if v != 1 %}s{% endif %}</span>
        </li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
